name: Receber produtos

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: achadinhos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  receber:
    if: vars.PAUSAR != '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ler mensagens do Telegram
        run: python -m bot.receber
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Salvar
        run: |
          git config user.name "achadinhos-bot"
          git config user.email "achadinhos-bot@users.noreply.github.com"
          git add -A data site
          if git diff --cached --quiet; then
            echo "Nada novo."
          else
            git commit -m "Recebe produtos"
            git pull --rebase
            git push
          fi
